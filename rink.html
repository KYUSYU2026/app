<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画面共有</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #content {
            width: 80%;
            height: 80%;
            background: #333;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div id="content">
        <h1>ここに共有したい内容を入れるゴン</h1>
        <p>テキスト、画像、iframe、動画など何でもOKゴン。</p>
    </div>
</body>
</html>
