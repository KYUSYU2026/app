<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Local Search Browser</title>
<style>
    body {
        background: #222;
        color: #fff;
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
    }
    #search {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        margin-bottom: 20px;
    }
    .result {
        background: #333;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
    }
</style>
</head>
<body>

<h2>ローカル検索ブラウザ（iframeなし）ゴン</h2>

<input id="search" type="text" placeholder="検索ワードを入力ゴン">

<div id="results"></div>

<script>
// 🔍 検索対象データ（自由に追加できるゴン）
const pages = [
    { title: "HTML入門", content: "HTMLはWebページを作るための言語ゴン。" },
    { title: "JavaScript", content: "JSはブラウザで動くプログラムゴン。" },
    { title: "CSS", content: "CSSはデザインを担当するゴン。" },
    { title: "糸島市", content: "糸島市は自然が豊かで最高ゴン。" }
];

const searchBox = document.getElementById("search");
const results = document.getElementById("results");

searchBox.addEventListener("input", function() {
    const keyword = searchBox.value.trim();
    results.innerHTML = "";

    if (!keyword) return;

    const filtered = pages.filter(p =>
        p.title.includes(keyword) || p.content.includes(keyword)
    );

    filtered.forEach(p => {
        const div = document.createElement("div");
        div.className = "result";
        div.innerHTML = `<h3>${p.title}</h3><p>${p.content}</p>`;
        results.appendChild(div);
    });
});
</script>

</body>
</html>
