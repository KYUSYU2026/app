<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini Browser with Search</title>
<style>
    body {
        margin: 0;
        font-family: sans-serif;
        background: #222;
        color: #fff;
    }
    #topbar {
        padding: 8px;
        background: #333;
        display: flex;
        gap: 8px;
        align-items: center;
    }
    #url, #search {
        flex: 1;
        padding: 6px;
        border-radius: 4px;
        border: none;
    }
    button {
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #555;
        color: #fff;
    }
    button:disabled {
        background: #444;
        cursor: default;
    }
    #go {
        background: #4caf50;
    }
    #searchBtn {
        background: #2196f3;
    }
    iframe {
        width: 100%;
        height: calc(100vh - 50px);
        border: none;
        background: #111;
    }
</style>
</head>
<body>

<div id="topbar">
    <button id="back" disabled>← 戻る</button>
    <button id="forward" disabled>進む →</button>

    <input id="url" type="text" placeholder="URLを入力ゴン">
    <button id="go">開くゴン</button>

    <input id="search" type="text" placeholder="検索ワードを入力ゴン">
    <button id="searchBtn">検索ゴン</button>
</div>

<iframe id="view" src=""></iframe>

<script>
const historyStack = [];
let currentIndex = -1;

const urlInput = document.getElementById("url");
const searchInput = document.getElementById("search");
const view = document.getElementById("view");
const backBtn = document.getElementById("back");
const forwardBtn = document.getElementById("forward");
const goBtn = document.getElementById("go");
const searchBtn = document.getElementById("searchBtn");

function updateButtons() {
    backBtn.disabled = currentIndex <= 0;
    forwardBtn.disabled = currentIndex >= historyStack.length - 1;
}

function openUrl(url) {
    if (!url) return;

    if (currentIndex < historyStack.length - 1) {
        historyStack.splice(currentIndex + 1);
    }

    historyStack.push(url);
    currentIndex = historyStack.length - 1;

    view.src = url;
    urlInput.value = url;
    updateButtons();
}

backBtn.onclick = function() {
    if (currentIndex > 0) {
        currentIndex--;
        const url = historyStack[currentIndex];
        view.src = url;
        urlInput.value = url;
        updateButtons();
    }
};

forwardBtn.onclick = function() {
    if (currentIndex < historyStack.length - 1) {
        currentIndex++;
        const url = historyStack[currentIndex];
        view.src = url;
        urlInput.value = url;
        updateButtons();
    }
};

goBtn.onclick = function() {
    const url = urlInput.value.trim();
    openUrl(url);
};

urlInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        openUrl(urlInput.value.trim());
    }
});

// 🔍 検索機能ゴン
searchBtn.onclick = function() {
    const keyword = searchInput.value.trim();
    if (!keyword) return;

    // Google検索URLを生成ゴン
    const searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(keyword);

    openUrl(searchUrl);
};

searchInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const keyword = searchInput.value.trim();
        if (!keyword) return;
        const searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(keyword);
        openUrl(searchUrl);
    }
});
</script>

</body>
</html>
